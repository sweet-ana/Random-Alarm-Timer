<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Random Alarm Timer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="header-section">
      <h1>RANDOM ALARM TIMER</h1>
      <div class="lang-switch">
        <div class="lang-toggle">
          <button class="lang-option active" data-lang="ru">RU</button>
          <button class="lang-option" data-lang="en">EN</button>
        </div>
      </div>
    </div>

    <div class="card">
      <div class="controls">
        <label data-i18n="duration">Длительность (минуты)
          <input type="number" id="duration" min="1" value="10">
        </label>
        <label data-i18n="count">Количество сигналов
          <input type="number" id="count" min="1" value="5">
        </label>
        <div class="buttons">
          <button id="start" class="primary" data-i18n="start">▶ Старт</button>
          <button id="pause" class="secondary" disabled data-i18n="pause">⏸ Пауза</button>
          <button id="reset" class="secondary" disabled data-i18n="reset">⟲ Сброс</button>
        </div>
      </div>
      <div id="error" class="error"></div>
    </div>

    <div class="card">
      <div class="timer-display">
        <div id="time-left">00:00</div>
        <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
      </div>
      <div class="status" id="status" data-i18n="status-default">Задайте параметры и нажмите «Старт»</div>

      <div class="history">
        <div class="history-title" data-i18n="history-title">История сигналов</div>
        <div id="history-list">
          <div class="empty-history" data-i18n="history-empty">Пока пусто</div>
        </div>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modal">
    <div class="modal-card">
      <div class="modal-title" id="modal-title">Сигнал №1</div>
      <div class="modal-sub" data-i18n="modal-sub">Время срабатывания</div>
      <div class="modal-time" id="modal-time">00:00</div>
      <button id="modal-confirm" class="primary" data-i18n="modal-confirm">Подтвердить</button>
    </div>
  </div>

  <script src="script.js" defer></script>
</body>
</html>
